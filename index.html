<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Điều Hành Vận Hành ECP × ELA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --surface:#FAFAF8; --sunk:#F3F3EF; --ink:#1C1C1A; --ink-soft:#44443F;
  --muted:#6B6B64; --rule:#E4E4DF; --accent:#0F6E52; --accent-bg:#EAF3EF;
  --critical:#B02418; --warning:#9A6B00;
  --ecp:#0F6E52; --ela:#8A5A00;
}
*{box-sizing:border-box;}
body{margin:0;background:#FFFFFF;color:var(--ink);
  font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1120px;margin:0 auto;padding:30px 22px 56px;}
.num{font-variant-numeric:tabular-nums;}

/* ---- Masthead ---- */
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 7px;}
h1{font-size:25px;line-height:1.18;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:-.01em;}
.sub{font-size:13px;color:var(--muted);margin:0;}
.sub b{color:var(--ink-soft);font-weight:600;}

/* ---- Verdict ---- */
.verdict{margin:20px 0 8px;border:1px solid var(--rule);border-left:3px solid var(--accent);
  background:var(--surface);border-radius:0 10px 10px 0;padding:15px 18px;}
.verdict .vh{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px;}
.verdict p{margin:0 0 8px;font-size:14px;color:var(--ink-soft);}
.verdict p:last-child{margin-bottom:0;}
.verdict b{color:var(--ink);font-weight:600;}

/* ---- Section heads ---- */
h2{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink);text-transform:uppercase;
  margin:34px 0 4px;padding-bottom:7px;border-bottom:1.5px solid var(--ink);}
.h2note{font-size:12px;color:var(--muted);margin:0 0 14px;}

/* ---- Two-column duo ---- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:760px){.duo{grid-template-columns:1fr;}}

.panel{border:1px solid var(--rule);border-radius:11px;background:var(--paper);overflow:hidden;}
.panel > .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:12px 15px;border-bottom:1px solid var(--rule);background:var(--surface);}
.ph .pname{font-size:14.5px;font-weight:700;color:var(--ink);}
.ph .ploc{font-size:11.5px;color:var(--muted);}
.ph.ecp{border-top:3px solid var(--ecp);}
.ph.ela{border-top:3px solid var(--ela);}
.pbody{padding:14px 15px;}

/* ---- KPI grid ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.kpi{background:var(--surface);border-radius:8px;padding:10px 11px;}
.kpi .kl{font-size:10.8px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;line-height:1.3;min-height:2.1em;}
.kpi .kv{font-size:21px;font-weight:700;line-height:1.05;color:var(--ink);}
.kpi .kv .u{font-size:12px;font-weight:500;color:var(--muted);}
.kpi .kd{font-size:11.5px;margin-top:3px;font-weight:600;}
.dn{color:var(--critical);} .up{color:var(--accent);} .fl{color:var(--muted);} .wn{color:var(--warning);}

/* ---- Progress bars ---- */
.prog{margin:2px 0 0;}
.prog .row{margin:0 0 10px;}
.prog .row:last-child{margin-bottom:0;}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;margin:0 0 4px;color:var(--ink-soft);}
.prog .lab b{color:var(--ink);font-weight:600;}
.bar{height:8px;background:var(--sunk);border-radius:20px;overflow:hidden;}
.bar > span{display:block;height:100%;background:var(--accent);border-radius:20px;}
.bar.warn > span{background:var(--warning);}

/* ---- Lists (done / todo) ---- */
ul.clean{list-style:none;margin:0;padding:0;}
ul.clean li{position:relative;padding:0 0 9px 17px;font-size:12.9px;color:var(--ink-soft);}
ul.clean li:last-child{padding-bottom:0;}
ul.clean li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--accent);}
ul.clean li b{color:var(--ink);font-weight:600;}

/* ---- Action items ---- */
.act{border-top:1px solid var(--rule);padding:10px 0 0;margin:10px 0 0;}
.act:first-child{border-top:0;padding-top:0;margin-top:0;}
.act .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;vertical-align:1px;margin-right:7px;}
.t-decide{background:#F7DED9;color:#8A1D13;}
.t-fill{background:#FBEED0;color:#7A5300;}
.t-verify{background:var(--accent-bg);color:var(--accent);}
.act .atitle{font-size:12.9px;font-weight:600;color:var(--ink);}
.act .ameta{font-size:11.5px;color:var(--muted);margin:3px 0 0;}
.act .ameta .own{color:var(--ink-soft);font-weight:600;}
.freeze{color:var(--critical);font-weight:600;}

/* ---- Data-quality callout ---- */
.ksnb{margin-top:14px;border:1px solid var(--rule);border-left:3px solid var(--warning);
  background:var(--surface);border-radius:0 10px 10px 0;padding:13px 16px;}
.ksnb h3{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warning);font-weight:700;margin:0 0 8px;}
.ksnb ul{margin:0;padding-left:16px;}
.ksnb li{font-size:12.6px;color:var(--ink-soft);margin:0 0 6px;}
.ksnb li:last-child{margin-bottom:0;}
.ksnb li b{color:var(--ink);font-weight:600;}

/* ---- Footer ---- */
.foot{margin-top:30px;border-top:1px solid var(--rule);padding-top:12px;font-size:11px;color:var(--muted);line-height:1.55;}
.foot b{color:var(--ink-soft);}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 8px;}
.legend span{font-size:11px;color:var(--muted);}

/* ---- Print economy ---- */
@media print{
  body{background:#fff;}
  .wrap{max-width:none;padding:0;}
  .panel,.verdict,.ksnb,.kpi{background:#fff !important;}
  .kpi{border:1px solid #ddd;}
  :root{--muted:#222;--ink-soft:#222;}
  .panel,.verdict,.ksnb,.act,section{break-inside:avoid;}
  h2{break-after:avoid;}
  a{color:inherit;text-decoration:none;}
}
</style>

<div class="wrap" id="app">
  <p class="eyebrow">Kiểm soát Nội bộ &amp; Quản trị Rủi ro · Báo cáo điều hành</p>
  <h1>Bảng Điều Hành Vận Hành — Eco Central Park &amp; Eco Retreat</h1>
  <p class="sub" id="sub">Đang tải dữ liệu…</p>
  <div id="sections"></div>
</div>

<script>
// Data lives beside the page. Opened from anywhere else (a claude.ai artifact,
// a local copy) the relative path fails and we fall back to the published copy,
// so one file works everywhere.
const DATA_ABS = 'https://ttrng3.github.io/ecp-ela-weekly/data/';
let DATA_BASE = 'data/';
let IDX = null, W = null;

async function fetchJSON(u){
  const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + u);
  return r.json();
}
async function getJSON(p){
  try { return await fetchJSON(DATA_BASE + p); }
  catch(e){ if(DATA_BASE === DATA_ABS) throw e; DATA_BASE = DATA_ABS; return fetchJSON(DATA_BASE + p); }
}

const P = () => IDX.projects;
function panel(side, sub, inner){
  const p = P()[side];
  return `<div class="panel"><div class="ph ${side}"><span class="pname">${p.name}</span>`
       + `<span class="ploc">${sub || p.loc}</span></div><div class="pbody">${inner}</div></div>`;
}
const duo = (a,b) => `<div class="duo">${a}${b}</div>`;

function kpiBlock(side){
  const rows = W.kpis[side].map(k =>
    `<div class="kpi"><p class="kl">${k.label}</p>`
    + `<div class="kv num">${k.value}${k.unit ? `<span class="u"> ${k.unit}</span>` : ''}</div>`
    + `<div class="kd ${k.cls} num">${k.delta}</div></div>`).join('');
  return panel(side, null, `<div class="kpis">${rows}</div>`);
}
const doneBlock = side => panel(side, 'Việc đã hoàn thành',
  `<ul class="clean">${W.done[side].map(x=>`<li>${x}</li>`).join('')}</ul>`);
function progBlock(side, sub){
  const rows = W.progress[side].map(r =>
    `<div class="row"><div class="lab"><span>${r.label}</span><b class="num">${r.value}</b></div>`
    + `<div class="bar${r.warn ? ' warn' : ''}"><span style="width:${r.pct}%"></span></div></div>`).join('');
  return panel(side, sub, `<div class="prog">${rows}</div>`);
}
const actBlock = side => panel(side, 'Ưu tiên', W.actions[side].map(a =>
  `<div class="act"><div><span class="tag t-${a.tag.toLowerCase()}">${a.tag}</span>`
  + `<span class="atitle">${a.title}</span></div><p class="ameta">${a.meta}</p></div>`).join(''));

function render(){
  document.getElementById('sub').innerHTML = W.sub;
  document.getElementById('sections').innerHTML = [
    `<div class="verdict"><p class="vh">Kết luận nhanh cho BLĐ</p>`
      + `<p>${W.verdict.lead}</p><p>${W.verdict.points}</p></div>`,
    `<h2>Chỉ số chính — ${W.week} so ${W.prev.split(' (')[0]}</h2>`,
    `<p class="h2note">Giá trị = ${W.week} (mới nhất). Δ = thay đổi so ${W.prev.split(' (')[0]}. Mọi số đọc trực tiếp từ báo cáo gốc.</p>`,
    duo(kpiBlock('ecp'), kpiBlock('ela')),
    `<h2>Đã làm được trong tuần</h2>`,
    `<p class="h2note">Tiến độ thực nhận và vận hành ghi nhận từ báo cáo ${W.week}.</p>`,
    duo(doneBlock('ecp'), doneBlock('ela')),
    `<h2>Tiến độ bàn giao – nghiệm thu</h2>`,
    `<p class="h2note">Bàn giao (ECP) và nghiệm thu theo lịch Ban QLXD (ELA), tại ${W.week}.</p>`,
    duo(progBlock('ecp','Bàn giao lũy kế'), progBlock('ela','Nghiệm thu theo lịch QLXD')),
    `<h2>Việc cần làm / cần quyết — trình BLĐ</h2>`,
    `<p class="h2note">DECIDE = cần quyết định · FILL = cần bổ sung dữ liệu · VERIFY = cần đối chiếu/xác minh.</p>`,
    duo(actBlock('ecp'), actBlock('ela')),
    `<div class="ksnb"><h3>Ghi chú Kiểm soát Nội bộ — chất lượng dữ liệu báo cáo</h3>`
      + `<ul>${W.ksnb.map(x=>`<li>${x}</li>`).join('')}</ul></div>`,
    `<div class="foot"><div class="legend">${W.legend.map(x=>`<span>${x}</span>`).join('')}</div>`
      + `<p><b>Nguồn:</b> ${W.sourceNote}</p></div>`
  ].join('\n');
}

async function boot(){
  IDX = await getJSON('index.json');
  W = await getJSON('weeks/' + (IDX.weeks[IDX.current] || IDX.current) + '.json');
  render();
}
boot().catch(err => {
  document.getElementById('sub').innerHTML =
    '<b style="color:#B02418">Không nạp được dữ liệu:</b> ' + (err.message || err)
    + ' — nguồn <code>' + DATA_BASE + 'index.json</code>';
});
</script>

</body></html>

<title>Điều Hành Vận Hành ECP × ELA</title>
<style>
/* ============================================================
   BASE SHEET — Apple HIG light tokens. Materials live in (light only)
   #apple-layer below (screen only; print stays light).
   Replaces the warm-paper / Be Vietnam Pro treatment, 2026-09-23.
   System font only: no webfont link, nothing to block render.
   Markup and the data layer are untouched — this block is style only.
   ============================================================ */
:root{
  --bg:#F2F2F7; --paper:#FFFFFF; --surface:#F2F2F7; --sunk:#F2F2F7;
  --line:#E5E5EA; --line-soft:#EFEFF2; --rule:#E5E5EA;
  --ink:#1C1C1E; --ink-soft:#3C3C43; --muted:#8E8E93;

  --blue:#007AFF; --blue-bg:#E8F1FE; --blue-ink:#0060DF; --blue-line:#CFE3FD;
  --green:#34C759; --green-bg:#E6F7EB; --green-ink:#1E7F3C;
  --amber:#FF9500; --amber-bg:#FFF4E5; --amber-ink:#8A5200; --amber-line:#F6DFBC;
  --red:#FF3B30; --red-bg:#FFEBE9; --red-ink:#C4271D; --red-line:#F7D2CE;

  /* Names the rest of the sheet still uses. */
  --accent:#007AFF; --accent-bg:#E8F1FE;
  --critical:#C4271D; --warning:#8A5200;

  /* Project identity — NOT status. Two hues that separate under every CVD
     type, and never reused for a state. */
  --ecp:#007AFF; --ela:#5856D6;

  --r-card:12px; --r-inner:8px; --r-pill:12px;
  --sans:-apple-system,BlinkMacSystemFont,"San Francisco","Helvetica Neue",Helvetica,Ubuntu,Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink-soft);font-family:var(--sans);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:32px 64px}
.num{font-variant-numeric:tabular-nums}

/* ---- Masthead ---- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
h1{font-size:28px;line-height:1.2;font-weight:600;color:var(--ink);margin:0 0 8px;letter-spacing:-.021em;text-wrap:balance}
.sub{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.sub b{color:var(--ink-soft);font-weight:600}

/* ---- Verdict ---- */
.verdict{margin:24px 0 8px;border:1px solid var(--blue-line);background:var(--blue-bg);
  border-radius:var(--r-card);padding:16px 20px}
.verdict .vh{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--blue-ink);font-weight:600;margin:0 0 6px}
.verdict p{margin:0 0 8px;font-size:14px;color:var(--ink-soft)}
.verdict p:last-child{margin-bottom:0}
.verdict b{color:var(--ink);font-weight:600}

/* ---- Section heads ---- */
h2{font-size:20px;font-weight:500;letter-spacing:-.012em;color:var(--ink);text-transform:none;
  margin:32px 0 4px;padding-bottom:0;border-bottom:0;line-height:1.3;text-wrap:balance}
.h2note{font-size:12px;color:var(--muted);margin:0 0 14px}

/* ---- Two-column duo ---- */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.duo{grid-template-columns:1fr}}

.panel{border:1px solid var(--line);border-radius:var(--r-card);background:var(--paper);overflow:hidden}
.panel > .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.ph .pname{font-size:16px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:7px}
.ph .pname::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.ph .ploc{font-size:12px;color:var(--muted)}
.ph.ecp{border-top:0}
.ph.ela{border-top:0}
.ph.ecp .pname::before{background:var(--ecp)}
.ph.ela .pname::before{background:var(--ela)}
.pbody{padding:16px 20px}

/* ---- KPI grid ---- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border-radius:var(--r-inner);padding:12px 14px}
.kpi .kl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin:0 0 4px;line-height:1.3;min-height:2.1em}
.kpi .kv{font-size:24px;font-weight:600;line-height:1.15;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .kv .u{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .kd{font-size:12px;margin-top:4px;font-weight:600;font-variant-numeric:tabular-nums}
.dn{color:var(--red-ink)} .up{color:var(--green-ink)} .fl{color:var(--muted)} .wn{color:var(--amber-ink)}

/* ---- Progress bars ---- */
.prog{margin:2px 0 0}
.prog .row{margin:0 0 12px}
.prog .row:last-child{margin-bottom:0}
.prog .lab{display:flex;justify-content:space-between;font-size:12px;margin:0 0 5px;color:var(--ink-soft)}
.prog .lab b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--bg);border-radius:20px;overflow:hidden}
.bar > span{display:block;height:100%;background:var(--green);border-radius:20px}
.bar.warn > span{background:var(--amber)}

/* ---- Lists (done / todo) ---- */
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{position:relative;padding:0 0 10px 18px;font-size:13px;color:var(--ink-soft)}
ul.clean li:last-child{padding-bottom:0}
ul.clean li::before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
ul.clean li b{color:var(--ink);font-weight:600}

/* ---- Action items ---- */
.act{border-top:1px solid var(--line-soft);padding:12px 0 0;margin:12px 0 0}
.act:first-child{border-top:0;padding-top:0;margin-top:0}
/* Tag carries a dot and a word: amber and green sit 7.1 dE apart under
   protanopia, so colour alone does not separate these states. */
.act .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;letter-spacing:0;
  padding:2px 8px;border-radius:var(--r-pill);vertical-align:1px;margin-right:7px;line-height:1.5}
.act .tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-decide{background:var(--red-bg);color:var(--red-ink)}
.t-fill{background:var(--amber-bg);color:var(--amber-ink)}
.t-verify{background:var(--blue-bg);color:var(--blue-ink)}
.act .atitle{font-size:13px;font-weight:600;color:var(--ink)}
.act .ameta{font-size:12px;color:var(--muted);margin:4px 0 0}
.act .ameta .own{color:var(--ink-soft);font-weight:600}
.freeze{color:var(--red-ink);font-weight:600}

/* ---- Data-quality callout ---- */
.ksnb{margin-top:16px;border:1px solid var(--amber-line);background:var(--amber-bg);
  border-radius:var(--r-card);padding:16px 20px}
.ksnb h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--amber-ink);font-weight:600;margin:0 0 8px}
.ksnb ul{margin:0;padding-left:18px}
.ksnb li{font-size:13px;color:var(--ink-soft);margin:0 0 6px}
.ksnb li:last-child{margin-bottom:0}
.ksnb li b{color:var(--ink);font-weight:600}

/* ---- Footer ---- */
.foot{margin-top:40px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted);line-height:1.55}
.foot b{color:var(--ink-soft)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 8px}
.legend span{font-size:12px;color:var(--muted)}

@media (max-width:560px){
  h1{font-size:24px}
  .wrap{padding-block:24px 48px}
  .verdict,.pbody,.ksnb{padding:16px}
  .panel > .ph{padding:14px 16px}
  .kpis{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- Print: this gets photocopied ---- */
@media print{
  body{background:#FFFFFF;font-size:11pt}
  :root{--muted:#222;--ink-soft:#222;--bg:#FFFFFF;--line:#BBBBBB;--line-soft:#DDDDDD}
  .wrap{max-width:none;padding:0}
  .panel,.verdict,.ksnb,.kpi,.panel > .ph{background:#FFFFFF !important}
  .panel,.verdict,.ksnb,.kpi{border:1px solid #BBB}
  .panel,.verdict,.ksnb,.act,section{break-inside:avoid}
  h2{break-after:avoid}
  .act .tag{background:#FFFFFF !important;color:#222 !important;border:1px solid #777}
  .bar > span,.ph .pname::before,ul.clean li::before{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  a{color:#222 !important;text-decoration:underline}
}
</style>
<style id="apple-layer">
/* ============================================================
   APPLE LAYER — apple-design skill, 2026-09-24.
   Additive: sits after the base sheet and only overrides.
   LIGHT ONLY (Ty, 2026-09-24): no dark theme — do not add one.
   ============================================================ */
:root{color-scheme:light;
  --shadow-card:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --shadow-float:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
}
body{background:var(--bg);color:var(--ink-soft)}
/* Inset wells (KPI tiles, bar tracks) sit one step below the card.
   Light: --sunk equals --bg, so nothing changes; dark: #2C2C2E on #1C1C1E. */
.kpi,.bar{background:var(--sunk)}
.load-err{color:var(--red-ink)}

/* Typography — optical sizing; small captions get a hair of positive tracking.
   Classes that already carry size-specific tracking (.eyebrow, .kl, .vh) keep it. */
body{font-optical-sizing:auto;text-rendering:optimizeLegibility}
.sub,.h2note,.ploc,.ameta,.foot,.legend span{letter-spacing:.01em}

/* Materials — cards float; the verdict reads one layer higher */
.panel,.ksnb{box-shadow:var(--shadow-card)}
.verdict{box-shadow:var(--shadow-float)}

/* Response — feedback on press, instant (no controls today; ready if any land) */
button,summary{transition:transform 100ms ease-out}
button:active,summary:active{transform:scale(.97)}

/* Accessibility — the three independent signals (no translucent chrome on this page) */
@media (prefers-contrast:more){:root{--line:#8E8E93;--line-soft:#C7C7CC;--muted:#3C3C43}}
@media (prefers-reduced-motion:reduce){button:active,summary:active{transform:none}}

@media print{.panel,.ksnb,.verdict{box-shadow:none!important}}
</style>

<div class="wrap" id="app">
  <p class="eyebrow">Kiểm soát Nội bộ &amp; Quản trị Rủi ro · Báo cáo điều hành</p>
  <h1>Bảng Điều Hành Vận Hành — Eco Central Park &amp; Eco Retreat</h1>
  <p class="sub" id="sub">Đang tải dữ liệu…</p>
  <div id="sections"></div>
</div>

<script>
// Data lives beside the page. Opened from a local copy or a mirrored copy,
// the relative path fails and we fall back to the published copy, so one file
// works everywhere.
const DATA_ABS = 'https://ttrng3.github.io/ecp-ela-weekly/data/';
let DATA_BASE = 'data/';
let IDX = null, W = null;

async function fetchJSON(u){
  const r = await fetch(u + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + u);
  return r.json();
}
async function getJSON(p){
  try { return await fetchJSON(DATA_BASE + p); }
  catch(e){ if(DATA_BASE === DATA_ABS) throw e; DATA_BASE = DATA_ABS; return fetchJSON(DATA_BASE + p); }
}

const P = () => IDX.projects;
function panel(side, sub, inner){
  const p = P()[side];
  return `<div class="panel"><div class="ph ${side}"><span class="pname">${p.name}</span>`
       + `<span class="ploc">${sub || p.loc}</span></div><div class="pbody">${inner}</div></div>`;
}
const duo = (a,b) => `<div class="duo">${a}${b}</div>`;

function kpiBlock(side){
  const rows = W.kpis[side].map(k =>
    `<div class="kpi"><p class="kl">${k.label}</p>`
    + `<div class="kv num">${k.value}${k.unit ? `<span class="u"> ${k.unit}</span>` : ''}</div>`
    + `<div class="kd ${k.cls} num">${k.delta}</div></div>`).join('');
  return panel(side, null, `<div class="kpis">${rows}</div>`);
}
const doneBlock = side => panel(side, 'Việc đã hoàn thành',
  `<ul class="clean">${W.done[side].map(x=>`<li>${x}</li>`).join('')}</ul>`);
function progBlock(side, sub){
  const rows = W.progress[side].map(r =>
    `<div class="row"><div class="lab"><span>${r.label}</span><b class="num">${r.value}</b></div>`
    + `<div class="bar${r.warn ? ' warn' : ''}"><span style="width:${r.pct}%"></span></div></div>`).join('');
  return panel(side, sub, `<div class="prog">${rows}</div>`);
}
const actBlock = side => panel(side, 'Ưu tiên', W.actions[side].map(a =>
  `<div class="act"><div><span class="tag t-${a.tag.toLowerCase()}">${a.tag}</span>`
  + `<span class="atitle">${a.title}</span></div><p class="ameta">${a.meta}</p></div>`).join(''));

function render(){
  document.getElementById('sub').innerHTML = W.sub;
  document.getElementById('sections').innerHTML = [
    `<div class="verdict"><p class="vh">Kết luận nhanh cho BLĐ</p>`
      + `<p>${W.verdict.lead}</p><p>${W.verdict.points}</p></div>`,
    `<h2>Chỉ số chính — ${W.week} so ${W.prev.split(' (')[0]}</h2>`,
    `<p class="h2note">Giá trị = ${W.week} (mới nhất). Δ = thay đổi so ${W.prev.split(' (')[0]}. Mọi số đọc trực tiếp từ báo cáo gốc.</p>`,
    duo(kpiBlock('ecp'), kpiBlock('ela')),
    `<h2>Đã làm được trong tuần</h2>`,
    `<p class="h2note">Tiến độ thực nhận và vận hành ghi nhận từ báo cáo ${W.week}.</p>`,
    duo(doneBlock('ecp'), doneBlock('ela')),
    `<h2>Tiến độ bàn giao – nghiệm thu</h2>`,
    `<p class="h2note">Bàn giao (ECP) và nghiệm thu theo lịch Ban QLXD (ELA), tại ${W.week}.</p>`,
    duo(progBlock('ecp','Bàn giao lũy kế'), progBlock('ela','Nghiệm thu theo lịch QLXD')),
    `<h2>Việc cần làm / cần quyết — trình BLĐ</h2>`,
    `<p class="h2note">DECIDE = cần quyết định · FILL = cần bổ sung dữ liệu · VERIFY = cần đối chiếu/xác minh.</p>`,
    duo(actBlock('ecp'), actBlock('ela')),
    `<div class="ksnb"><h3>Ghi chú Kiểm soát Nội bộ — chất lượng dữ liệu báo cáo</h3>`
      + `<ul>${W.ksnb.map(x=>`<li>${x}</li>`).join('')}</ul></div>`,
    `<div class="foot"><div class="legend">${W.legend.map(x=>`<span>${x}</span>`).join('')}</div>`
      + `<p><b>Nguồn:</b> ${W.sourceNote}</p></div>`
  ].join('\n');
}

async function boot(){
  IDX = await getJSON('index.json');
  W = await getJSON('weeks/' + (IDX.weeks[IDX.current] || IDX.current) + '.json');
  render();
}
boot().catch(err => {
  document.getElementById('sub').innerHTML =
    '<b class="load-err">Không nạp được dữ liệu:</b> ' + (err.message || err)
    + ' — nguồn <code>' + DATA_BASE + 'index.json</code>';
});
</script>
